# CarPlayPlus — GitHub Actions build workflow.
#
# Runs on Ubuntu (GitHub-hosted) with a full Theos toolchain:
#   1. clone Theos (+ submodules)
#   2. install the iOS 14.5 SDK (used for iphone:clang:14.5:14.0)
#   3. `make package FINALPACKAGE=1` produces the .deb
#   4. artifacts are uploaded; pushing a `v*` tag publishes a GitHub Release

name: Build CarPlayPlus

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: /opt/theos
  SDK_VERSION: "14.5"
  # lld (used on Linux) has no arm64e backend; build the arm64 slice only.
  ARCHS: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Host toolchain
      # ------------------------------------------------------------
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm fakeroot dpkg-dev git-lfs \
            unzip curl ca-certificates

      # ------------------------------------------------------------
      # Theos
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown -R "$USER" "$THEOS"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/theos/theos.git "$THEOS"

      - name: Install ldid (prebuilt)
        id: ldid
        continue-on-error: true
        run: |
          curl -fL --retry 3 -o "$THEOS/bin/ldid" \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64"
          chmod +x "$THEOS/bin/ldid"

      - name: Build ldid from source (fallback)
        if: steps.ldid.outcome == 'failure'
        run: |
          git clone --depth 1 https://github.com/theos/ldid.git /tmp/ldid-src
          make -C /tmp/ldid-src -j2
          cp /tmp/ldid-src/ldid "$THEOS/bin/ldid"
          chmod 755 "$THEOS/bin/ldid"

      # On Linux, Theos expects its (fake) toolchain at
      # $THEOS/toolchain/linux/iphone/bin, pointing at host clang and lld.
      # clang drives the link itself and picks ld64.lld for Mach-O targets.
      - name: Create fake toolchain
        run: |
          set -e
          TC="$THEOS/toolchain/linux/iphone/bin"
          sudo mkdir -p "$TC"
          sudo ln -sf "$(command -v clang)" "$TC/clang"
          sudo ln -sf "$(command -v clang++)" "$TC/clang++"
          for t in ar nm ranlib strip strings; do
            if [ -x "/usr/bin/llvm-$t" ]; then
              sudo ln -sf "/usr/bin/llvm-$t" "$TC/$t"
            elif [ -x "/usr/bin/$t" ]; then
              sudo ln -sf "/usr/bin/$t" "$TC/$t"
            fi
          done
          [ -x /usr/bin/ld64.lld ] && sudo ln -sf /usr/bin/ld64.lld "$TC/ld64.lld"
          [ -x /usr/bin/ld.lld ] && sudo ln -sf /usr/bin/ld.lld "$TC/ld"
          # clang drives links with the system `ld` by default; point it at
          # ld64.lld so Mach-O linking works (GNU ld.bfd cannot link iOS targets).
          sudo ln -sf /usr/bin/ld64.lld /usr/bin/ld
          ls -la "$TC"

      # ------------------------------------------------------------
      # iOS SDK (cached across runs)
      # ------------------------------------------------------------
      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS${{ env.SDK_VERSION }}.sdk
          key: theos-sdk-${{ env.SDK_VERSION }}

      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo mkdir -p "$THEOS/sdks"
          sudo chown -R "$USER" "$THEOS/sdks"
          # xybp888/iOS-SDKs keeps each SDK as a directory tracked with
          # Git LFS — a partial sparse clone fetches only the version we need.
          git lfs install --skip-repo
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          for v in "$SDK_VERSION" "15.2" "16.0"; do
            echo "::group::Checking out iPhoneOS${v}.sdk ..."
            if git -C /tmp/ios-sdks sparse-checkout set "iPhoneOS${v}.sdk" 2>/dev/null && \
               [ -d "/tmp/ios-sdks/iPhoneOS${v}.sdk/System" ]; then
              cp -R "/tmp/ios-sdks/iPhoneOS${v}.sdk" "$THEOS/sdks/"
              echo "iOS ${v} SDK installed."
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          ls -la "$THEOS/sdks"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Preflight logos syntax
        run: |
          perl "$THEOS/bin/logos.pl" Tweak/CarPlayPlus.xm > /dev/null
          echo "logos preflight OK"

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1 ARCHS=arm64

      - name: List packages
        run: |
          find . -name '*.deb' -exec ls -lh {} \;

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayPlus-${{ github.sha }}
          path: |
            **/*.deb
          if-no-files-found: error

      # ------------------------------------------------------------
      # Release (only when a tag like v1.0.0 is pushed)
      # ------------------------------------------------------------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.deb
          generate_release_notes: true