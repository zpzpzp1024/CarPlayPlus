# CarPlayPlus — GitHub Actions build workflow.
#
# Dopamine (arm64e rootless) loads PreferenceBundles from an arm64e-only
# context, so the package must contain an arm64e slice. Building arm64e
# requires Apple's toolchain, so this workflow runs on a macOS runner
# (Xcode + ld64). The iOS 14.5 SDK is fetched from xybp888/iOS-SDKs with
# a sparse, blob=none clone (same trick as the old Ubuntu job), and the
# local private-header/stub files kept the build self-contained.
#
#   1. clone Theos (+ submodules)
#   2. install the iOS 14.5 SDK
#   3. `make package FINALPACKAGE=1 ARCHS="arm64 arm64e"` -> fat .deb
#      (rootless scheme: /var/jb layout, iphoneos-arm64 architecture)
#   4. artifacts are uploaded; pushing a `v*` tag publishes a GitHub Release

name: Build CarPlayPlus

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_VERSION: "14.5"

jobs:
  build:
    runs-on: macos-latest
    env:
      # runner.temp is only available in job-level contexts
      THEOS: ${{ runner.temp }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Theos (macOS native; Xcode supplies clang/ld64 which support
      # both arm64 and arm64e slices natively)
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/theos/theos.git "$THEOS"

      - name: Install packaging tools (ldid, dpkg)
        run: |
          brew install ldid dpkg
          mkdir -p "$THEOS/bin"
          cp "$(command -v ldid)" "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"

      # ------------------------------------------------------------
      # iOS SDK (cached across runs)
      # ------------------------------------------------------------
      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS${{ env.SDK_VERSION }}.sdk
          key: theos-sdk-macos-${{ env.SDK_VERSION }}

      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          git lfs install --skip-repo
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          for v in "$SDK_VERSION" "15.2" "16.0"; do
            echo "::group::Checking out iPhoneOS${v}.sdk ..."
            if git -C /tmp/ios-sdks sparse-checkout set "iPhoneOS${v}.sdk" 2>/dev/null && \
               [ -d "/tmp/ios-sdks/iPhoneOS${v}.sdk/System" ]; then
              cp -R "/tmp/ios-sdks/iPhoneOS${v}.sdk" "$THEOS/sdks/"
              echo "iOS ${v} SDK installed."
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          ls -la "$THEOS/sdks"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Preflight logos syntax
        run: |
          perl "$THEOS/bin/logos.pl" Tweak/CarPlayPlus.xm > /dev/null
          echo "logos preflight OK"

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: List packages
        run: |
          find . -name '*.deb' -exec ls -lh {} \;

      - name: Verify binary architectures
        run: |
          DEB=$(find . -name '*.deb' | head -1)
          echo "=== $DEB ==="
          mkdir -p /tmp/debx
          tar -xf "$DEB" -C /tmp/debx
          python3 - <<'PY'
import glob, lzma, tarfile, io
p = glob.glob('/tmp/debx/data.tar.*')[0]
t = tarfile.open(fileobj=io.BytesIO(lzma.decompress(open(p,'rb').read())))
for m in t.getmembers():
    if m.isfile():
        print(m.name)
PY
          echo "=== bundles ==="
          python3 - <<'PY'
import glob, lzma, tarfile, io, os
p = glob.glob('/tmp/debx/data.tar.*')[0]
t = tarfile.open(fileobj=io.BytesIO(lzma.decompress(open(p,'rb').read())))
t.extractall('/tmp/debx/data')
PY
          for f in $(find /tmp/debx/data -type f \( -name 'CarPlayPlus*' -o -name 'dylib' \) ! -name '*.plist'); do
            file "$f"
          done

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayPlus-${{ github.sha }}
          path: |
            **/*.deb
          if-no-files-found: error

      # ------------------------------------------------------------
      # Release (only when a tag like v1.0.0 is pushed)
      # ------------------------------------------------------------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.deb
          generate_release_notes: true